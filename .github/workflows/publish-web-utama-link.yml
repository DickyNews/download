name: Publish Web Utama Link
on:
  workflow_dispatch:
    inputs:
      target_config:
        description: Konfigurasi link dan versi per aplikasi dalam JSON
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Web Utama
        uses: actions/checkout@v4
      - name: Validate and update selected links and titles
        env:
          TARGET_CONFIG: ${{ inputs.target_config }}
        run: |
          python3 - <<'PY'
          import os, json, base64, re
          from urllib.parse import urlparse

          try:
              raw_config = json.loads(os.environ["TARGET_CONFIG"])
          except Exception as exc:
              raise SystemExit("Konfigurasi target bukan JSON valid") from exc
          if isinstance(raw_config, dict) and "items" in raw_config:
              mode = str(raw_config.get("mode", "link"))
              config = raw_config.get("items")
              youtube_url = str(raw_config.get("youtube_url", "")).strip()
              password = str(raw_config.get("password", ""))
          else:
              mode, config, youtube_url, password = "link", raw_config, "", ""
          if mode not in {"link", "like"}:
              raise SystemExit("Mode publikasi tidak dikenal")
          if mode == "like":
              yt = urlparse(youtube_url)
              if yt.scheme != "https" or yt.hostname not in {"youtube.com","www.youtube.com","youtu.be","www.youtu.be"}:
                  raise SystemExit("URL video YouTube tidak valid")
              if not password or len(password) > 200:
                  raise SystemExit("Password unlocker kosong atau terlalu panjang")
          allowed = {"gb_WA_pro","mb_WA","delta_WA","lite_x_WA","wa_enhancer_ori","wa_enhancer_biz"}
          versioned_titles = {
              "gb_WA_pro": ("GB WA PRO TERBARU ", "link-gb"),
              "mb_WA": ("MB WA TERBARU ", "link-mb"),
              "delta_WA": ("DELTA WA TERBARU ", "link-delta"),
              "lite_x_WA": ("LITE X WA TERBARU ", "link-litex"),
          }
          if not isinstance(config, dict) or not config or any(t not in allowed for t in config):
              raise SystemExit("Konfigurasi target kosong atau tidak diizinkan")
          normalized = {}
          for target, item in config.items():
              if not isinstance(item, dict):
                  raise SystemExit("Konfigurasi tidak valid: " + target)
              url = str(item.get("mediafire_url", "")).strip()
              suffix = str(item.get("version_suffix", "")).strip()
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in {"mediafire.com","www.mediafire.com"} or not parsed.path.startswith(("/file/","/download/")):
                  raise SystemExit("URL MediaFire tidak valid untuk " + target)
              if suffix and not re.fullmatch(r"[vV]?[0-9]+(?:[._+-][0-9A-Za-z]+)*", suffix):
                  raise SystemExit("Versi tidak valid untuk " + target)
              if suffix and not suffix.upper().startswith("V"):
                  suffix = "V" + suffix
              normalized[target] = {"url":url,"suffix":suffix}

          path = "index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()
          marker = "const LINK_SETTINGS = {"
          start = html.find(marker)
          end = html.find("\n        };", start)
          if start < 0 or end < 0:
              raise SystemExit("LINK_SETTINGS tidak ditemukan; file tidak diubah")
          lines = html[start:end].splitlines()
          for target, item in normalized.items():
              # Web Utama buttons always use the original standalone task page.
              # linklikecomment is a separate entry page that returns to Web Utama;
              # wiring it into a download button would create a redirect loop.
              encoded = base64.urlsafe_b64encode(item["url"].encode()).decode().rstrip("=")
              generated = "https://dickynews.github.io/linkdickynews/?v=" + encoded
              hits = [i for i,line in enumerate(lines) if line.lstrip().startswith(target + ":")]
              if len(hits) != 1:
                  raise SystemExit("Target tidak ditemukan tepat satu kali: " + target)
              i = hits[0]
              indent = lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines[i] = indent + target + ": " + json.dumps(generated) + ","
          html = html[:start] + "\n".join(lines) + html[end:]

          for target, item in normalized.items():
              suffix = item["suffix"]
              mapping = versioned_titles.get(target)
              if not suffix or not mapping:
                  continue
              prefix, title_id = mapping
              anchor = re.search(r'<a\b[^>]*\bid="' + re.escape(title_id) + r'"(?=[\s>])', html)
              if not anchor:
                  raise SystemExit("Tombol produk tidak ditemukan: " + target)
              card_start = html.rfind('<div class="glass-card download-box"', 0, anchor.start())
              card_end = html.find("</div>", anchor.end())
              if card_start < 0 or card_end < 0:
                  raise SystemExit("Kartu produk tidak ditemukan: " + target)
              card = html[card_start:card_end]
              title_pattern = re.compile(r'(<span\b[^>]*>)' + re.escape(prefix) + r'[^<]*(</span>)')
              updated_card, count = title_pattern.subn(lambda m: m.group(1) + prefix + suffix + m.group(2), card, count=1)
              if count != 1:
                  raise SystemExit("Judul versi tidak ditemukan di kartu target: " + target)
              html = html[:card_start] + updated_card + html[card_end:]
              print("Judul diperbarui:", target, "=>", prefix + suffix)

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          print("Link diperbarui untuk tombol:", ", ".join(normalized))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Publish Web Utama links and per-app versions"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload updated Web Utama
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated Web Utama
        id: deployment
        uses: actions/deploy-pages@v4
