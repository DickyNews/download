name: Publish Web Utama Link
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Daftar tombol dipisahkan koma (contoh gb_WA_pro,mb_WA)
        required: true
        type: string
      mediafire_url:
        description: Link MediaFire tujuan
        required: true
        type: string
      version_suffix:
        description: Ekor versi untuk judul target terpilih, contoh V26.98 (kosongkan jika tidak diubah)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: publish-web-utama-link
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web Utama
        uses: actions/checkout@v4
      - name: Validate and update selected links
        env:
          TARGETS: ${{ inputs.targets }}
          MEDIAFIRE_URL: ${{ inputs.mediafire_url }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          python3 - <<'PY'
          import os, json, base64, re
          from urllib.parse import urlparse
          path = "index.html"
          targets = [item.strip() for item in os.environ["TARGETS"].split(",") if item.strip()]
          url = os.environ["MEDIAFIRE_URL"].strip()
          version_suffix = os.environ.get("VERSION_SUFFIX", "").strip()
          allowed = {"gb_WA_pro","mb_WA","delta_WA","lite_x_WA","wa_enhancer_ori","wa_enhancer_biz"}
          versioned_titles = {
              "gb_WA_pro": "GB WA PRO TERBARU ",
              "mb_WA": "MB WA TERBARU ",
              "delta_WA": "DELTA WA TERBARU ",
              "lite_x_WA": "LITE X WA TERBARU ",
          }
          if version_suffix and not re.fullmatch(r"[A-Za-z0-9._+-]{1,40}", version_suffix):
              raise SystemExit("Ekor versi tidak valid; gunakan huruf, angka, titik, garis bawah, +, atau -")
          parsed = urlparse(url)
          if not targets or len(set(targets)) != len(targets) or any(t not in allowed for t in targets):
              raise SystemExit("Daftar tombol kosong, duplikat, atau tidak diizinkan")
          if parsed.scheme != "https" or parsed.hostname not in {"mediafire.com","www.mediafire.com"} or not parsed.path.startswith(("/file/","/download/")):
              raise SystemExit("URL harus berupa link MediaFire HTTPS yang valid")
          with open(path, encoding="utf-8") as f:
              html = f.read()
          marker = "const LINK_SETTINGS = {"
          start = html.find(marker)
          end = html.find("\n        };", start)
          if start < 0 or end < 0:
              raise SystemExit("LINK_SETTINGS tidak ditemukan; file tidak diubah")
          section = html[start:end]
          lines = section.splitlines()
          encoded = base64.urlsafe_b64encode(json.dumps({"url":url}, separators=(",",":")).encode()).decode().rstrip("=")
          generated = "https://dickynews.github.io/youtubeadmin/?module=link&v=" + encoded
          for target in targets:
              hits = [i for i,line in enumerate(lines) if line.lstrip().startswith(target + ":")]
              if len(hits) != 1:
                  raise SystemExit("Target tidak ditemukan tepat satu kali: " + target)
              i = hits[0]
              indent = lines[i][:len(lines[i])-len(lines[i].lstrip())]
              lines[i] = indent + target + ": " + json.dumps(generated) + ","
          updated = "\n".join(lines)
          html = html[:start] + updated + html[end:]
          if version_suffix:
              title_ids = {
                  "gb_WA_pro": "link-gb",
                  "mb_WA": "link-mb",
                  "delta_WA": "link-delta",
                  "lite_x_WA": "link-litex",
              }
              for target in targets:
                  prefix = versioned_titles.get(target)
                  title_id = title_ids.get(target)
                  if not prefix or not title_id:
                      continue
                  # Locate the selected product card first so an unrelated title can never be changed.
                  anchor = re.search(r'<a\\s+id="' + re.escape(title_id) + r'"\\b', html)
                  if not anchor:
                      raise SystemExit("Tombol produk tidak ditemukan: " + target)
                  card_start = html.rfind('<div class="glass-card download-box"', 0, anchor.start())
                  card_end = html.find("</div>", anchor.end())
                  if card_start < 0 or card_end < 0:
                      raise SystemExit("Kartu produk tidak ditemukan: " + target)
                  card = html[card_start:card_end]
                  title_pattern = r'(<span\\b[^>]*>)' + re.escape(prefix) + r'[^<]*(</span>)'
                  updated_card, count = re.subn(title_pattern, lambda m: m.group(1) + prefix + version_suffix + m.group(2), card, count=1)
                  if count != 1:
                      raise SystemExit("Judul versi tidak ditemukan di kartu target: " + target)
                  html = html[:card_start] + updated_card + html[card_end:]
                  print("Judul diperbarui:", prefix + version_suffix)
          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          print("Link diperbarui untuk tombol:", ", ".join(targets))
          if version_suffix:
              print("Ekor versi diperbarui untuk target yang memiliki judul versi:", version_suffix)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Publish Web Utama links: ${{ inputs.targets }}"
          git push
