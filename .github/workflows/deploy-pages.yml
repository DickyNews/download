name: Deploy Web Utama to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-stale-deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: deploy
    steps:
      - name: Mark stale queued or in-progress deployments inactive
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentSha = context.sha;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
              environment: 'github-pages',
              per_page: 100
            });

            const currentCandidates = deployments.filter(d => d.sha === currentSha && d.ref === 'main');
            let currentDeployment = null;
            for (const d of currentCandidates) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: d.id, per_page: 1
              });
              if (statuses.data[0]?.state === 'success') {
                currentDeployment = d;
                break;
              }
            }

            if (!currentDeployment) {
              core.setFailed('No successful GitHub Pages deployment found for this commit; refusing to alter older deployments.');
              return;
            }

            const currentTime = Date.parse(currentDeployment.created_at);
            let cleaned = 0;
            for (const d of deployments) {
              if (d.id === currentDeployment.id || d.ref !== 'main' || Date.parse(d.created_at) >= currentTime) continue;
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: d.id, per_page: 1
              });
              const state = statuses.data[0]?.state;
              if (state === 'in_progress' || state === 'queued') {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: d.id,
                  state: 'inactive',
                  description: 'Superseded by a newer successful GitHub Pages deployment',
                  auto_inactive: false
                });
                core.info(`Marked stale deployment ${d.id} (${d.sha.slice(0, 7)}) inactive; previous state was ${state}.`);
                cleaned++;
              }
            }
            core.info(`Cleanup complete. Marked ${cleaned} stale deployment(s) inactive.`);
